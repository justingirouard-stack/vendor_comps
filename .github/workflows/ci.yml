name: CI

on:
  push:
    branches:
      - main
      - 'add/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (if any)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then
            pytest -q || true
          fi

      - name: Run extractor to produce comparison
        run: |
          mkdir -p output
          python -m scripts.extract_normalize --input-dir tests/fixtures --output-dir output --master-products master_products.csv

      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor_price_comparison
          path: output/vendor_price_comparison.xlsxrison.xlsx
